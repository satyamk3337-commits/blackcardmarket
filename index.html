<style>
:root{--bg:#070814;--panel:#0d1021;--panel2:#11162a;--line:#252b4a;--text:#f7f7ff;--muted:#9298b5;--purple:#8b5cf6;--pink:#ec4899;--blue:#3b82f6;--green:#10d89b;--orange:#ff9f1c;--red:#ff416c}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#26134a 0,#0a0b18 35%,#05060d 100%);color:var(--text);font-family:Inter,Arial,sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(#ffffff05 1px,transparent 1px),linear-gradient(90deg,#ffffff05 1px,transparent 1px);background-size:42px 42px}
.container{width:min(1180px,94%);margin:auto}.top{margin:22px 0 18px;padding:22px 24px;border:1px solid #343a60;border-radius:28px;background:linear-gradient(145deg,#15152d,#0c0e1e 70%);box-shadow:0 0 45px #7c3aed20;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{font-size:30px;font-weight:800;letter-spacing:1px}.brand b{color:#a855f7}.status{display:inline-flex;gap:8px;align-items:center;color:#aeb4cf;font-size:13px;margin-top:7px}.dot{width:9px;height:9px;border-radius:50%;background:#00d89a;box-shadow:0 0 12px #00d89a}
.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid #3a3e66;background:#171a31;color:white;padding:12px 16px;border-radius:13px;font-weight:700;cursor:pointer}.btn.primary{background:linear-gradient(90deg,#7c3aed,#a855f7);box-shadow:0 0 22px #8b5cf655}.btn.red{background:linear-gradient(90deg,#ef315b,#ff416c)}

.tabs{display:flex;gap:8px;overflow:auto;padding:10px;border:1px solid #303553;border-radius:18px;background:#0d1020;margin:18px 0 28px}.tab{white-space:nowrap;border:0;background:transparent;color:#aeb4cf;padding:13px 18px;border-radius:12px;font-weight:700;cursor:pointer}.tab.active{background:linear-gradient(90deg,#8b5cf6,#a855f7);color:#fff;box-shadow:0 0 25px #8b5cf655}

footer{border-top:1px solid #202640;color:#777e9c;padding:25px 0 50px;text-align:center;font-size:12px}

@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start;flex-direction:column}}
@media(max-width:560px){.grid{grid-template-columns:1fr}.top{padding:18px}.hero{padding-top:30px}.actions{width:100%}.actions .btn{flex:1}}

const BCM_DATA_VERSION="2026-09-25-demo-v2";
/* BLACKCARD MARKET shared Netlify sync */
const BCM_API="/.netlify/functions/api";
async function bcmFetchState(){
  try{const r=await fetch(BCM_API,{cache:"no-store"});if(!r.ok)return null;return await r.json();}catch(e){return null}
}
async function bcmSyncFromServer(){
  const st=await bcmFetchState(); if(!st)return false;
  if(Array.isArray(st.products)){ localStorage.setItem("bcm_products",JSON.stringify(st.products)); loadProducts(); }
  if(st.payment) localStorage.setItem("bcm_payment",JSON.stringify(st.payment));
  if(st.settings) localStorage.setItem("bcm_settings",JSON.stringify(st.settings));
  if(Array.isArray(st.orders)) localStorage.setItem("bcm_orders",JSON.stringify(st.orders));
  return true;
}
async function bcmSaveShared(type,data){
  try{
    const r=await fetch(BCM_API,{method:"POST",headers:{"Content-Type":"application/json","x-bcm-admin-password":sessionStorage.getItem("bcm_admin_password")||""},body:JSON.stringify({action:"save",type,data})});
    if(!r.ok){console.warn("Shared save failed",await r.text());return false}
    return true;
  }catch(e){console.warn(e);return false}
}
async function bcmRefreshShared(){
  if(await bcmSyncFromServer()){ products=loadProducts(); render(); }
}

function loadProducts(){
  try {
    const raw=localStorage.getItem("bcm_products");
    const legacyNames=new Set(["Standard Tier","Premium Tier","Business Tier","Infinite Tier","Advanced Tier","Elite Tier","Corporate Tier","Platinum Tier","Gold Tier","Royal Tier","Desi VIP Tier","Speed VIP Tier"]);
    let current=raw?JSON.parse(raw):[];
    if(!Array.isArray(current)) current=[];
    let cleaned=current.filter(p=>!legacyNames.has(String(p.name||"")));
    const existingTiers=new Set(cleaned.map(p=>String(p.tier||"")));
    defaults.forEach(d=>{if(!existingTiers.has(String(d.tier))) cleaned.push({...d});});
    localStorage.setItem("bcm_products",JSON.stringify(cleaned));
    localStorage.setItem("bcm_data_version",BCM_DATA_VERSION);
    return cleaned;
  } catch(e){ localStorage.setItem("bcm_products",JSON.stringify(defaults)); return defaults.slice(); }
}
let products=loadProducts();
let filter="ALL";
const tabs=[["ALL","All Cards"],["VISA","Visa"],["MASTERCARD","Mastercard"],["RUPAY","RuPay"],["FREE","Free Card"]];
function money(n){return "₹"+Number(n).toLocaleString("en-IN")}
function demoAccountFor(p){
  if(p&&p.demoAccount) return String(p.demoAccount);
  const str=String(p&&p.name||"CARD"); let h=0; for(let i=0;i<str.length;i++) h=(h*31+str.charCodeAt(i))>>>0;
  return `BCM1/${1000+(h%9000)}/${1000+((h>>>4)%9000)}/${1000+((h>>>8)%9000)}/${1000+((h>>>12)%9000)}`;
}
function renderTabs(){document.getElementById("tabs").innerHTML=tabs.map(([k,l])=>`<button class="tab ${filter===k?'active':''}" onclick="setFilter('${k}')">${l}</button>`).join("")}
function render(){
  renderTabs();
  const list=products.filter(p=>filter==="ALL"||(filter==="FREE"?Number(p.fee)===0:p.network===filter));
  document.getElementById("grid").innerHTML=list.length ? list.map((p)=>`<article class="card">
    <div class="badge">• CARD</div>
    <div class="visual ${p.color||"blue"}">
      <div class="chip"></div>
      <div class="network">${p.network||"CARD"}</div>
      <div class="nums">•••• •••• ••••</div>
      <div class="holder"><b>${p.name||"Card"}</b></div>
    </div>
    <div class="meta">
      <div>Price<b>${money(p.fee||0)}</b></div>
      <div>Voucher Value<b>${money(p.voucherValue ?? p.limit ?? 0)}</b></div>
    </div>
    <div style="margin:-2px 2px 12px;color:#9da4bf;font-size:12px">Card Name <b style="color:#f4f4ff">${p.name||"—"}</b></div>
    <button class="buy" onclick='buy(${JSON.stringify(p)})'>VIEW / BUY</button>
  </article>`).join("") : `<div class="empty">No cards in this category.</div>`;
}
function refreshProducts(){ products=loadProducts(); render(); }
window.addEventListener("storage",e=>{ if(e.key==="bcm_products") refreshProducts(); });
window.addEventListener("pageshow",refreshProducts);

function getPaymentSettings(){try{const p=JSON.parse(localStorage.getItem("bcm_payment")||"{}")||{};if(!p.qr || p.qr==="/qr.png" || p.qr.startsWith("http")) p.qr=BCM_DEFAULT_QR;return p}catch(e){return {qr:BCM_DEFAULT_QR}}}
function buy(p){
  const safeName=String(p.name||"Card").replace(/[<>]/g,"");
  const pay=getPaymentSettings(), qr=pay.qr||"";
  const qrHtml=qr?`<div class="qrwrap"><img src="${qr}" alt="Payment QR" onerror="this.onerror=null;this.src=BCM_DEFAULT_QR"></div>`:`<div class="qrwrap"><img src="${BCM_DEFAULT_QR}" alt="Payment QR"></div>`;
  document.getElementById("modalBody").innerHTML=`<h2>Buy — ${safeName}</h2>${qrHtml}<p style="margin:6px 0 4px;color:#cbd0e2;font-size:12px">Scan the QR above and enter your UTR / Transaction ID.</p><input id="utr" class="utr" inputmode="text" maxlength="50" placeholder="Enter UTR / Transaction ID"><button class="btn primary" style="width:100%;margin-top:8px" onclick="submitUTR()">Submit UTR</button><p class="note">Your order will remain pending until it is verified by the admin.</p>`;
  window.currentProduct=Object.assign({},p); openModal();
}
function submitUTR(){const utr=(document.getElementById("utr")?.value||"").trim();if(!utr){alert("Please enter the UTR / Transaction ID");return;}placeOrder(window.currentProduct||{},utr)}
function bcmCustomerId(){let id=localStorage.getItem("bcm_customer_id");if(!id){id="CUS-"+Date.now()+"-"+Math.random().toString(36).slice(2);localStorage.setItem("bcm_customer_id",id)}return id}
function placeOrder(product,utr){const orders=JSON.parse(localStorage.getItem("bcm_orders")||"[]");orders.unshift({id:"BCM-"+Date.now(),ownerId:bcmCustomerId(),product:String(product.name||"Card"),productData:{name:product.name||"Card",network:product.network||"CARD",limit:Number(product.limit||0),holder:product.holder||"AYUSH",country:product.country||"India • Delhi",demoAccount:product.demoAccount||demoAccountFor(product),demoCvv:product.demoCvv||"123",demoExpiry:product.demoExpiry||product.expiry||"12/30",demoOnly:true},utr,date:new Date().toLocaleString(),status:"Pending"});localStorage.setItem("bcm_orders",JSON.stringify(orders));bcmSaveShared("orders",orders);document.getElementById("modalBody").innerHTML=`<h2>Order Submitted</h2><p style="color:#9da4bf">Your UTR has been submitted. Demo card information will appear in My Orders only after admin verification.</p><button class="btn primary" onclick="closeModal()">Done</button>`}
async function openOrders(){await bcmSyncFromServer();const all=JSON.parse(localStorage.getItem("bcm_orders")||"[]");const o=all.filter(x=>x.ownerId===bcmCustomerId());let html="<h2>My Orders</h2>";if(!o.length) html+="<p>No orders yet.</p>";else html+=o.map(x=>{const d=x.productData||{};const safe=(v)=>String(v??"—").replace(/[<>]/g,"");let extra="";if(x.status==="Completed"&&d.demoOnly){extra=`<div style="margin-top:12px;padding:14px;border:1px solid #303754;border-radius:14px;background:#0b0f1c"><div style="font-weight:900;margin-bottom:10px">💳 CARD DETAILS</div><div style="font-size:12px;color:#9da4bf;line-height:1.8">CARD NO.<b style="display:block;color:#fff;letter-spacing:1px">${safe(d.demoAccount)}</b>CVV<b style="display:block;color:#fff">${safe(d.demoCvv)}</b>MM/YY<b style="display:block;color:#fff">${safe(d.demoExpiry)}</b>CARD HOLDER NAME<b style="display:block;color:#fff">${safe(d.holder)}</b>COUNTRY<b style="display:block;color:#fff">${safe(d.country)}</b></div><div style="margin-top:10px;text-align:center;border-top:1px solid #252b45;padding-top:10px;font-weight:900;color:#17dca3">VERIFIED ✓</div><div style="margin-top:8px;text-align:center;font-size:10px;color:#ffb52e;font-weight:800">DEMO / TEST ONLY — NOT A REAL PAYMENT CARD</div></div>`}return `<div style="border-bottom:1px solid #2b3150;padding:12px 0"><b>${safe(x.id)}</b><br>${safe(x.product)}<br><small>${safe(x.date)} · ${safe(x.status)}</small>${extra}</div>`}).join("");document.getElementById("modalBody").innerHTML=html;openModal()}
function support(){document.getElementById("modalBody").innerHTML="<h2>Support</h2><p style='color:#9da4bf'>Create a support ticket from the admin dashboard or contact your configured support channels.</p>";openModal()}
let modalHistory=false;
function openModal(){
  const modal=document.getElementById("modal");
  if(modal.classList.contains("open")) return;
  modal.classList.add("open");
  document.body.style.overflow="hidden";
  modalHistory=true;
  history.pushState({bcmModal:true},"",location.href);
}
function closeModal(fromPop=false){
  const modal=document.getElementById("modal");
  if(!modal.classList.contains("open")) return;
  if(modalHistory && !fromPop){ history.back(); return; }
  modal.classList.remove("open");
  document.body.style.overflow="";
  modalHistory=false;
}
window.addEventListener("popstate",()=>{
  if(document.getElementById("modal").classList.contains("open")) closeModal(true);
});
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal") closeModal();});
render();
bcmSyncFromServer().then(()=>{products=loadProducts();render();});
setInterval(bcmRefreshShared,15000);
